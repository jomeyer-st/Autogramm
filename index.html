<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Autogrammkarte sichern!</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    
    <div class="layout">
        <img src="autogramm karte.png" alt="Autogrammkarte" class="autogramm-image"  oncontextmenu="return false;">

        <main class="container">
            <h1>Hol dir deine Autogrammkarte!</h1>
            <p>Trag hier deine Daten ein, damit ich dir eine Autogrammkarte schicken kann.</p>

            
            <form action="DEINE_WEB3FORMS_URL_HIER" method="POST">
                <div class="form-group">
                    <label for="name">Dein Name / Stream-Name:</label>
                    <input type="text" id="name" name="name" required>
                </div>

                <div class="form-group">
                    <label for="street">Straße & Hausnummer:</label>
                    <input type="text" id="street" name="street" required>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="plz">PLZ:</label>
                        <input type="text" id="plz" name="plz" required>
                    </div>
                    <div class="form-group">
                        <label for="city">Ort:</label>
                        <input type="text" id="city" name="city" required>
                    </div>
                </div>

                <button type="submit">Autogrammkarte bestellen :)</button>

                <h6>Hinweis: Bitte überprüfe deine Daten sorgfältig, bevor du das Formular absendest. Ich kann keine Autogrammkarten an falsche oder unvollständige Adressen verschicken.</h6>

            </form>
            
        </main>
    </div>
    
</body>
</html>
